services:
  mysql-customer:
    image: mysql:8.0
    container_name: mysql-customer
    environment:
      MYSQL_ROOT_PASSWORD: admin@123
      MYSQL_DATABASE: customer_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin@123
    ports:
      - "3307:3306"
    volumes:
      - mysql-customer-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-padmin@123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-product:
    image: mysql:8.0
    container_name: mysql-product
    environment:
      MYSQL_ROOT_PASSWORD: admin@123
      MYSQL_DATABASE: product_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin@123
    ports:
      - "3308:3306"
    volumes:
      - mysql-product-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-padmin@123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    environment:
      MYSQL_ROOT_PASSWORD: admin@123
      MYSQL_DATABASE: order_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin@123
    ports:
      - "3309:3306"
    volumes:
      - mysql-order-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-padmin@123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-notification:
    image: mysql:8.0
    container_name: mysql-notification
    environment:
      MYSQL_ROOT_PASSWORD: admin@123
      MYSQL_DATABASE: notification_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin@123
    ports:
      - "3310:3306"
    volumes:
      - mysql-notification-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-padmin@123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  customer-service:
    build: ./customer-service
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      JDBC_DATABASE_URL: jdbc:mysql://mysql-customer:3306/customer_db?serverTimezone=UTC
      JDBC_DATABASE_USERNAME: admin
      JDBC_DATABASE_PASSWORD: admin@123
    depends_on:
      mysql-customer:
        condition: service_healthy

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      JDBC_DATABASE_URL: jdbc:mysql://mysql-product:3306/product_db?serverTimezone=UTC
      JDBC_DATABASE_USERNAME: admin
      JDBC_DATABASE_PASSWORD: admin@123
    depends_on:
      mysql-product:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      JDBC_DATABASE_URL: jdbc:mysql://mysql-notification:3306/notification_db?serverTimezone=UTC
      JDBC_DATABASE_USERNAME: admin
      JDBC_DATABASE_PASSWORD: admin@123
    depends_on:
      mysql-notification:
        condition: service_healthy

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      JDBC_DATABASE_URL: jdbc:mysql://mysql-order:3306/order_db?serverTimezone=UTC
      JDBC_DATABASE_USERNAME: admin
      JDBC_DATABASE_PASSWORD: admin@123
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      mysql-order:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
      notification-service:
        condition: service_started

volumes:
  mysql-customer-data:
  mysql-product-data:
  mysql-order-data:
  mysql-notification-data:
